# Pipeline da "plataforma" compartilhada (GitHub Actions): API Gateway (Kong,
# exposto por LoadBalancer) + Prometheus/Grafana. Roda o mesmo script que pode
# ser usado manualmente: scripts/deploy-platform.sh.
#
# Os microsserviços têm cada um o seu próprio workflow, no próprio repositório.
#
# Configuração (Settings > Secrets and variables > Actions) — feita por scripts/setup-github-oidc.sh:
#   Secrets   — AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID e JWT_SECRET_KEY
#               (mesma chave do UsersAPI/CatalogAPI).
#   Variables — AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME.

name: Deploy da plataforma

on:
  push:
    branches:
      - main
      - tech_fase_4 # shortcut: permite testar o deploy antes do merge; remover após o merge na main.
    paths:
      - k8s/kong/**
      - k8s/monitoring/**
      - scripts/deploy-platform.sh
      - .github/workflows/deploy-platform.yml
  # Permite rodar pela aba Actions (Run workflow), por exemplo no primeiro deploy.
  # O GitHub só mostra o botão depois que este arquivo existir na main.
  workflow_dispatch:

# Na mesma branch, uma execução nova espera a anterior terminar. Entre branches diferentes
# (main e tech_fase_4), quem impede dois deploys juntos é o concurrency do job de deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Permissão mínima do token do GitHub. O job de deploy pede id-token: write para o OIDC.
permissions:
  contents: read

jobs:
  # "environment: production" é proposital: o login no Azure é por OIDC (sem senha guardada).
  # A credencial federada no Azure só confia em tokens com o subject
  # repo:fiappostech2026/techchallenge_fase2_orchestration:environment:production.
  deploy:
    name: Kong + monitoramento no AKS
    runs-on: ubuntu-latest
    # Uma fila só para o deploy, em qualquer branch: main e tech_fase_4 não mexem no AKS juntas.
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    environment: production
    permissions:
      id-token: write   # necessário para o GitHub emitir o token OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Conectar no cluster AKS
        run: az aks get-credentials -g ${{ vars.AKS_RESOURCE_GROUP }} -n ${{ vars.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Executar scripts/deploy-platform.sh
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: bash scripts/deploy-platform.sh
