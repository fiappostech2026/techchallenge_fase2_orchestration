# Pipeline da "plataforma" compartilhada (Azure DevOps): API Gateway (Kong,
# exposto por LoadBalancer) + Prometheus/Grafana. Roda o mesmo script que pode
# ser usado manualmente: scripts/deploy-platform.sh.
#
# Os microsserviços têm cada um a sua própria pipeline, no próprio repositório.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - k8s/kong
      - k8s/monitoring
      - scripts
      - azure-pipelines.yml

pr: none

variables:
  - group: fcg-shared-secrets     # jwt-secret-key (mesma chave do UsersAPI/CatalogAPI)

  # Infraestrutura — ajuste para os nomes que vocês criaram no Azure.
  - name: azureServiceConnection
    value: fcg-azure
  - name: aksResourceGroup
    value: rg-fcg
  - name: aksClusterName
    value: aks-fcg

stages:
  - stage: Deploy
    displayName: Deploy da plataforma no AKS
    jobs:
      - deployment: DeployPlatform
        displayName: Kong + monitoramento
        pool:
          vmImage: ubuntu-latest
        environment: fcg-production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Executar scripts/deploy-platform.sh
                  inputs:
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials -g $(aksResourceGroup) -n $(aksClusterName) --overwrite-existing
                      bash scripts/deploy-platform.sh
                    env:
                      JWT_SECRET_KEY: $(jwt-secret-key)
