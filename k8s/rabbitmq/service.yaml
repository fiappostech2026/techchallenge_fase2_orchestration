# Nome deste Service ("rabbitmq") é o endereço que os outros
# microsserviços usam dentro do cluster para falar com o RabbitMQ,
# ex: RABBITMQ__HOST=rabbitmq (ver ConfigMap de cada microsserviço).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
