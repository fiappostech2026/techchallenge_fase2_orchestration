# Credenciais do RabbitMQ dentro do cluster Kubernetes.
# Valores em base64 de "guest" (usuário padrão de desenvolvimento).
# Em produção, troque por credenciais reais antes de gerar o base64.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: Z3Vlc3Q=
  RABBITMQ_DEFAULT_PASS: Z3Vlc3Q=
