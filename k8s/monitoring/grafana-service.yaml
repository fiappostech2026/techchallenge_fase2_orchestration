# Acesso: kubectl port-forward svc/grafana 3000:3000  ->  http://localhost:3000
# ClusterIP de propósito: não expor o Grafana (login padrão) com IP público no AKS.
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
