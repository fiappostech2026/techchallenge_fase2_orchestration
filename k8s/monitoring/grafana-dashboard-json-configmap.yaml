apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-fcg
data:
  fcg-dashboard.json: |
    {
      "title": "FCG - UsersAPI e CatalogAPI",
      "uid": "fcg-observabilidade",
      "timezone": "browser",
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Latência p95 por endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, controller, action))",
              "legendFormat": "{{controller}}/{{action}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Total de requisições (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count[5m]))",
              "legendFormat": "requisições/s"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requisições por status code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count[5m])) by (code)",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Taxa de erro (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count{code=~\"5..\"}[5m])) / sum(rate(http_request_duration_seconds_count[5m]))",
              "legendFormat": "taxa de erro"
            }
          ]
        }
      ]
    }
